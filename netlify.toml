# HealthSphere frontend — static SPA on Netlify.
# API target is the Render service healthsphere-api (healthsphere-api-oisy.onrender.com).

[build]
  base = "HealthSphere-main/HealthSphere_AI/frontend"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

# Proxy the API through Netlify so the browser stays on one origin.
# This keeps the HttpOnly hs_token cookie working (SameSite=Lax) and avoids CORS.
[[redirects]]
  from = "/api"
  to = "https://healthsphere-api-oisy.onrender.com/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://healthsphere-api-oisy.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — keep this last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
