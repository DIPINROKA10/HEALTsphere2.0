name: CI/CD Pipeline

# Honest pipeline note:
#  - "Lint" is a syntax check (node --check) — the repo has no ESLint/Prettier
#    config yet, so a formatting gate would fail without adding one first.
#  - Deploy / load-test / Slack steps self-skip (with a workflow notice) when
#    their secrets are not configured, so the pipeline stays green on forks
#    and local runners instead of failing on missing credentials.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  NODE_VERSION: '20'
  PROJECT_DIR: './HealthSphere_AI/backend'

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Syntax check (node --check on all JS)
        # Runs from the repo root so frontend + scripts are covered too;
        # '*/node_modules/*' excludes every vendored copy, not just ./node_modules.
        run: |
          set -e
          count=0
          while IFS= read -r f; do
            node --check "$f"
            count=$((count + 1))
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -not -path '*/node_modules/*')
          echo "Checked $count files"

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ env.PROJECT_DIR }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Start PostgreSQL test container (pgvector/pg16)
        run: |
          docker run -d --name test-db \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=healthsphere_test \
            -p 5432:5432 \
            pgvector/pgvector:pg16
          sleep 5

      - name: Provide migration input if db.json is not committed
        # backend/data/db.json contains local dev data and is intentionally not
        # in git, so a clean checkout has no migration source. Seed an empty
        # fixture so the migration still runs against the disposable test DB.
        run: |
          if [ ! -f HealthSphere_AI/backend/data/db.json ]; then
            mkdir -p HealthSphere_AI/backend/data
            printf '{}' > HealthSphere_AI/backend/data/db.json
            echo "::notice::No committed db.json — seeded empty fixture for the migration step"
          fi

      - name: Run migrations
        # migrate-to-postgres.mjs lives in HealthSphere_AI/scripts (one level
        # above the backend working directory) and honors SUPABASE_DB_URL; it
        # applies backend/lib/schema.sql itself before inserting.
        run: node scripts/migrate-to-postgres.mjs
        working-directory: ./HealthSphere_AI
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/healthsphere_test

      - name: Run unit tests
        run: npm test
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/healthsphere_test
          NODE_ENV: test

      - name: Cleanup test database
        if: always()
        run: docker rm -f test-db || true

  accessibility:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Verify frontend files exist
        run: ls -la HealthSphere_AI/frontend/js/*.js | wc -l

      - name: Start preview server
        run: |
          cd ${{ env.PROJECT_DIR }}
          node server.js &
          SERVER_PID=$!
          sleep 3
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      - name: Run axe-core accessibility audit
        run: |
          npx @axe-core/cli http://localhost:3000 \
            --tags wcag2a,wcag2aa,best-practice \
            --reporter json > accessibility-report.json || true
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: ${{ env.PROJECT_DIR }}/accessibility-report.json
          if-no-files-found: warn

      - name: Stop preview server
        if: always()
        run: kill $SERVER_PID || true
        shell: bash

  security-scan:
    name: Security Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Start preview server
        run: |
          cd ${{ env.PROJECT_DIR }}
          node server.js &
          SERVER_PID=$!
          sleep 3
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'

      - name: Stop preview server
        if: always()
        run: kill $SERVER_PID || true
        shell: bash

  load-test:
    name: Load Test (k6)
    runs-on: ubuntu-latest
    needs: [test, accessibility, security-scan]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Check load-test configuration
        id: cfg
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Load test skipped — STAGING_URL secret not configured"
          fi

      - name: Run k6 load test
        if: steps.cfg.outputs.configured == 'true'
        uses: grafana/k6-action@v0.2.0
        with:
          # Path is relative to the repo root (k6 runs from the workspace),
          # not to the backend working directory.
          filename: HealthSphere_AI/scripts/load-test.js
          env: |
            BASE_URL=${{ secrets.STAGING_URL }}
            TEST_DURATION=5m
            VUS=100

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, accessibility, security-scan]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy configuration
        id: cfg
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging deploy skipped — RAILWAY_TOKEN / RAILWAY_PROJECT_ID secrets not configured"
          fi

      - name: Deploy to Railway
        if: steps.cfg.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          curl -X POST "https://railway.app/api/v1/projects/${RAILWAY_PROJECT_ID}/deploy" \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"branch": "develop"}'

      - name: Wait for deployment
        if: steps.cfg.outputs.configured == 'true'
        run: sleep 60

      - name: Health check
        if: steps.cfg.outputs.configured == 'true'
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "::notice::Health check skipped — STAGING_URL secret not configured"
            exit 0
          fi
          for i in {1..10}; do
            if curl -f "${STAGING_URL}/api/health"; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed"
          exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Deliberately NOT depending on load-test / deploy-staging: both are
    # conditionally skipped (e.g. deploy-staging on a production dispatch), and
    # GitHub skips any job whose needs were skipped unless the `if` forces
    # continuation — which would make production deploys impossible.
    needs: [test, accessibility, security-scan]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy configuration
        id: cfg
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production deploy skipped — RAILWAY_TOKEN / RAILWAY_PROJECT_ID secrets not configured"
          fi

      - name: Deploy to Production
        if: steps.cfg.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          curl -X POST "https://railway.app/api/v1/projects/${RAILWAY_PROJECT_ID}/deploy" \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"branch": "main"}'

      - name: Wait for deployment
        if: steps.cfg.outputs.configured == 'true'
        run: sleep 60

      - name: Production health check
        if: steps.cfg.outputs.configured == 'true'
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::notice::Health check skipped — PRODUCTION_URL secret not configured"
            exit 0
          fi
          for i in {1..10}; do
            if curl -f "${PRODUCTION_URL}/api/health"; then
              echo "Production health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Production health check failed"
          exit 1

      - name: Notify team
        if: steps.cfg.outputs.configured == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d '{"text": "HealthSphere AI deployed to production"}'
          else
            echo "::notice::Slack notification skipped — SLACK_WEBHOOK not configured"
          fi

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-syntax, test, accessibility, security-scan, load-test, deploy-staging, deploy-production]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Send failure notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"Pipeline failed: ${{ github.workflow }} - ${{ github.job }}\"}"
          else
            echo "::notice::Slack notification skipped — SLACK_WEBHOOK not configured"
          fi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
